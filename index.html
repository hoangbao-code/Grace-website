<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraceSpeak Club — Nền Tảng Luyện Nói & Giao Tiếp Tiếng Anh Tương Tác</title>
    <meta
      name="description"
      content="GraceSpeak Club - Nền tảng phòng học tiếng Anh tương tác trực tiếp theo cấp độ (Newbie, Intermediate, Advance), hỗ trợ Leader host phòng, hiệu ứng animation thời gian thực và quản trị CLB."
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tự động làm sạch URL, loại bỏ mã theo dõi ?fbclid=... của Facebook và UTM tags -->
    <script>
      (function() {
        try {
          if (window.location.search && (window.location.search.indexOf('fbclid=') !== -1 || window.location.search.indexOf('utm_') !== -1)) {
            var cleanUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            if (window.history && window.history.replaceState) {
              window.history.replaceState({}, document.title, cleanUrl);
            }
          }
        } catch (e) {
          console.error('URL cleaner error:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-[#070A12] text-slate-100 font-sans min-h-screen overflow-x-hidden selection:bg-purple-500/30 selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
