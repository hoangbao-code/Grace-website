<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0B0F19" stroke="url(#grad-primary)" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#grad-primary)" opacity="0.08"/>

  <!-- Glowing Soundwaves / Orbit -->
  <circle cx="256" cy="256" r="160" stroke="#6366F1" stroke-width="3" stroke-dasharray="8 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="190" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 16" opacity="0.3"/>

  <!-- Stylized Speech Bubble & Intertwined "G" monogram -->
  <path d="M256 120 C180 120 120 176 120 248 C120 292 142 331 178 354 L160 404 L216 380 C229 383 242 385 256 385 C332 385 392 329 392 257 C392 185 332 120 256 120 Z" 
        fill="url(#grad-primary)" opacity="0.18" filter="url(#glow)"/>

  <!-- Core Monogram G + S Modern Crest -->
  <path d="M336 210 C320 170 285 152 245 152 C190 152 150 195 150 256 C150 317 190 360 250 360 C305 360 338 325 342 276 L250 276 L250 236 L386 236 C388 243 388 250 388 260 C388 340 332 400 248 400 C165 400 106 338 106 256 C106 174 168 112 250 112 C302 112 346 135 372 176 L336 210 Z" 
        fill="url(#grad-primary)"/>

  <!-- Sparkling North Star Accent (Speaking Mastery) -->
  <path d="M360 144 C360 168 376 184 400 184 C376 184 360 200 360 224 C360 200 344 184 320 184 C344 184 360 168 360 144 Z" 
        fill="url(#grad-accent)"/>
  <circle cx="400" cy="184" r="3" fill="#FFFFFF"/>
</svg>
